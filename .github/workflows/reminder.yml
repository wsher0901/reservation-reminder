name: Reservation Reminder

on:
  schedule:
    - cron: '13 * * * *'   # hourly at HH:13 UTC; the script does NY/DST + due-time logic
  workflow_dispatch:        # adds a "Run workflow" button for instant manual testing

concurrency:
  group: reservation-reminder
  cancel-in-progress: false   # never run two at once (queues instead) — belt-and-suspenders

jobs:
  run-reminder:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'        # caches deps so each run stays ~1 min (cheaper, faster)

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reminder script
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          TZ: America/New_York
        run: python reminder.py
